name: Update data and deploy

on:
  schedule:
    - cron: '7 * * * *' # every hour at :07 (UTC)
  workflow_dispatch: # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write # commit the updated data/ folder
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Run the data pipeline
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: npm run pipeline

      - name: Save pipeline state (data/) back to the repo
        run: |
          git config user.name "fx-bias-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: hourly update"
            # someone may have pushed code while this job ran: replay the data commit on top
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Build the site
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm run build
          # GitHub Pages serves 404.html for unknown paths; the app shows its own "page not found" view
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
